name: mobile_wallet
description: QRL Mobile Wallet

publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  protobuf: ^2.1.0
  grpc: ^3.0.2
  ffi: ^2.0.1
  shared_preferences: ^2.0.15
  get_it: ^7.2.0
  flutter_secure_storage: ^8.0.0
  intl: ^0.17.0
  qr_flutter: ^4.0.0
  qr_code_scanner: ^1.0.1
  decimal: ^2.3.0
  fixnum: ^1.1.0
  wakelock: ^0.6.2
  url_launcher: ^6.1.5
  font_awesome_flutter: ^10.2.1
  flutter_localizations:
    sdk: flutter
  http: ^0.13.5
  local_auth: ^2.1.2
  secure_application: ^3.8.0
  flutter_bloc: ^8.1.1
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.1
  flutter_local_notifications: ^13.0.0
  permission_handler: ^10.2.0
  firebase_messaging: ^14.4.1
  firebase_core: ^2.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.3.2
  build_runner: ^2.3.3
  test: ^1.22.0
  bloc_test: ^9.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/qrl-logo.png
    - assets/images/qrl-tree.png
    - assets/images/orange-dots.png
    - assets/images/background-balance.png
  fonts:
    - family: Roboto-Medium
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-MediumItalic.ttf
          style: italic
